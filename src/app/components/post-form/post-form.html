<div class="form-container">
  <div class="form-header">
    <a routerLink="/" class="back-link">← Back to posts</a>
    <h1>New Post</h1>
  </div>

  <form (ngSubmit)="onSubmit()" class="post-form" novalidate>
    @if (error()) {
      <div class="alert-error">{{ error() }}</div>
    }

    <div class="field">
      <label for="title">Title</label>
      <input
        id="title"
        type="text"
        [ngModel]="title()"
        (ngModelChange)="title.set($event)"
        name="title"
        placeholder="Enter post title"
        [class.invalid]="submitted() && !title().trim()"
      />
      @if (submitted() && !title().trim()) {
        <span class="field-error">Title is required.</span>
      }
    </div>

    <div class="field">
      <label for="author">Author</label>
      <input
        id="author"
        type="text"
        [ngModel]="author()"
        (ngModelChange)="author.set($event)"
        name="author"
        placeholder="Enter author name"
        [class.invalid]="submitted() && !author().trim()"
      />
      @if (submitted() && !author().trim()) {
        <span class="field-error">Author is required.</span>
      }
    </div>

    <div class="field">
      <label for="content">Content</label>
      <textarea
        id="content"
        rows="6"
        [ngModel]="content()"
        (ngModelChange)="content.set($event)"
        name="content"
        placeholder="Write your post content..."
        [class.invalid]="submitted() && !content().trim()"
      ></textarea>
      @if (submitted() && !content().trim()) {
        <span class="field-error">Content is required.</span>
      }
    </div>

    <div class="form-actions">
      <a routerLink="/" class="btn-cancel">Cancel</a>
      <button type="submit" class="btn-submit">Publish Post</button>
    </div>
  </form>
</div>
