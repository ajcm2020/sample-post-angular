@if (totalPages() > 1) {
  <nav class="pagination">
    <button
      class="page-btn"
      [disabled]="currentPage() === 1"
      (click)="goTo(currentPage() - 1)">
      ‹ Prev
    </button>

    @for (page of pages(); track page) {
      <button
        class="page-btn"
        [class.active]="page === currentPage()"
        (click)="goTo(page)">
        {{ page }}
      </button>
    }

    <button
      class="page-btn"
      [disabled]="currentPage() === totalPages()"
      (click)="goTo(currentPage() + 1)">
      Next ›
    </button>
  </nav>
}
